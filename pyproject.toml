[project]
name = "aws-waf-report-agent"
version = "0.1.0"
description = "Multi-agent WAF log analysis, threat validation, and rule optimization"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=0.3.0",
    "bedrock-agentcore>=1.4.0",
    "mcp>=1.0.0",
    "boto3>=1.42.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
